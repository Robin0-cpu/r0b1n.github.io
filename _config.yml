# Hexo 站点配置
# 文档: https://hexo.io/docs/configuration

# ---- 站点 ----
title: 我的博客
subtitle: ''
description: '记录、思考与折腾'
keywords:
author: R0b1n
language: zh-CN
timezone: 'Asia/Shanghai'

# ---- URL ----
# 重要: 仓库名是 <用户名>.github.io 时用下面这种写法
# 如果是普通仓库(如 blog), 必须写成 https://<用户名>.github.io/blog 且 root: /blog/
url: https://robin0-cpu.github.io/r0b1n.github.io
root: /r0b1n.github.io/
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# ---- 目录 ----
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# ---- 写作 ----
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude:
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false

# ---- 首页 ----
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# ---- 分类与标签 ----
default_category: uncategorized
category_map:
tag_map:

# ---- 元数据 ----
meta_generator: true

# ---- 日期格式 ----
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: mtime

# ---- 分页 ----
per_page: 10
pagination_dir: page

# ---- 包含/排除 ----
include:
exclude:
ignore:

# ---- 主题 ----
theme: butterfly
